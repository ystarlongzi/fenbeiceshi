name: 构建并部署分贝测试

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_environment:
        description: 初始化或检查部署环境
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: fenbeiceshi-production
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  # 同一 runner 构建后直接通过 SSH 发布，构建包无需存入 GitHub Artifacts。
  deploy:
    name: 检查、构建与 SSH 发布
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: production
      url: https://fenbeiceshi.com
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/www/wwwroot/fenbeiceshi' }}
      DOMAIN: fenbeiceshi.com
      SOUNDMETERGO_DEPLOY_PATH: ${{ vars.SOUNDMETERGO_DEPLOY_PATH || '/www/wwwroot/soundmetergo' }}
      NGINX_CONF_PATH: ${{ vars.NGINX_CONF_PATH || '/etc/nginx/conf.d' }}
      CERT_ROOT: ${{ vars.CERT_ROOT || '/etc/nginx/ssl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7，固定官方提交
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7，固定官方提交
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
        timeout-minutes: 20
      - name: 判断是否需要 Linux 集成测试
        id: deploy_changes
        env:
          DEPLOY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEPLOY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-deploy-changes.sh
      - name: 验证 Linux 发布与回滚
        if: steps.deploy_changes.outputs.required == 'true'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          hosts_backup=$(mktemp "$RUNNER_TEMP/fenbeiceshi-hosts-XXXXXX")
          sudo cp -- /etc/hosts "$hosts_backup"
          restore_hosts() {
            local status=$?
            trap - EXIT
            if ! sudo cp -- "$hosts_backup" /etc/hosts; then
              echo "::error::恢复 runner 域名解析失败"
              exit 1
            fi
            rm -f -- "$hosts_backup"
            exit "$status"
          }
          # 测试只访问 runner 本机，结束后恢复解析，供后续生产 SSH 与公网检查使用。
          trap restore_hosts EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          packages=()
          for item in nginx:nginx curl:curl openssl:openssl flock:util-linux stat:coreutils find:findutils tar:tar gzip:gzip; do
            if ! command -v "${item%%:*}" >/dev/null; then packages+=("${item#*:}"); fi
          done
          if (( ${#packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          else echo "测试工具已齐全，跳过安装"; fi
          sudo systemctl stop nginx
          printf '127.0.0.1 fenbeiceshi.com www.fenbeiceshi.com soundmetergo.com www.soundmetergo.com\n' | sudo tee -a /etc/hosts > /dev/null
          sudo env "PATH=$PATH" timeout --kill-after=5s 180s npm run test:deploy:integration
      - name: 打包完整静态导出
        run: npm run deploy:pack -- --release "$RELEASE_ID" --revision "$GITHUB_SHA"
      - name: 打包英文静态导出
        run: npm run deploy:pack -- --domain soundmetergo.com --release "$RELEASE_ID" --revision "$GITHUB_SHA"
      - name: 准备 SSH 凭据与主机公钥
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::缺少部署 Secret：$name"
              exit 1
            fi
          done
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/fenbeiceshi-ssh-XXXXXX")
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf 'SSH_PRIVATE_KEY_FILE=%s\n' "$ssh_dir/key" >> "$GITHUB_ENV"
          if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
            printf 'SSH_KNOWN_HOSTS_FILE=%s\n' "$ssh_dir/known_hosts" >> "$GITHUB_ENV"
          fi
      - name: 初始化或检查部署环境
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_environment
        timeout-minutes: 30
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          SSL_EMAIL: ${{ vars.SSL_EMAIL }}
          NGINX_CONF_PATH: ${{ vars.NGINX_CONF_PATH || '/etc/nginx/conf.d' }}
          CERT_ROOT: ${{ vars.CERT_ROOT || '/etc/nginx/ssl' }}
          DNS_ENV_FILE: ${{ vars.DNS_ENV_FILE || '/etc/fenbeiceshi/cloudflare.env' }}
          ACME_HOME: ${{ vars.ACME_HOME || '/root/.acme.sh-fenbeiceshi' }}
        run: npm run deploy:setup -- --bootstrap
      - name: 检查英文站点环境
        run: npm run deploy:setup -- --domain soundmetergo.com --path "$SOUNDMETERGO_DEPLOY_PATH" --dns-env /etc/soundmetergo/cloudflare.env --acme-home /root/.acme.sh-soundmetergo
      - name: 发布英文与健康检查
        timeout-minutes: 15
        run: npm run deploy:static -- --domain soundmetergo.com --path "$SOUNDMETERGO_DEPLOY_PATH" --artifact "artifacts/soundmetergo-$RELEASE_ID.tar.gz" --release "$RELEASE_ID"
      - name: 同步中文站点与旧英文跳转
        env:
          DNS_ENV_FILE: ${{ vars.DNS_ENV_FILE || '/etc/fenbeiceshi/cloudflare.env' }}
          ACME_HOME: ${{ vars.ACME_HOME || '/root/.acme.sh-fenbeiceshi' }}
        run: npm run deploy:setup
      - name: 发布与健康检查
        timeout-minutes: 15
        run: npm run deploy:static -- --artifact "artifacts/fenbeiceshi-$RELEASE_ID.tar.gz" --release "$RELEASE_ID"
      - name: 移除临时 SSH 文件
        if: always()
        shell: bash
        run: |
          if [[ -n "${SSH_PRIVATE_KEY_FILE:-}" ]]; then rm -f -- "$SSH_PRIVATE_KEY_FILE"; fi
          if [[ -n "${SSH_KNOWN_HOSTS_FILE:-}" ]]; then rm -f -- "$SSH_KNOWN_HOSTS_FILE"; fi
