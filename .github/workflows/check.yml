name: 项目检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # out/ 只在当前 runner 校验；后续发布在同一 job 直接通过 SSH 传输，不上传 GitHub Artifacts。
      - run: npm run check
